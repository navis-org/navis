name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      # This cancels any such job that is still runnning
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Blender
        run: |
          pwd
          wget -qO- https://mirrors.iu13.net/blender/release/Blender4.2/blender-4.2.4-linux-x64.tar.xz | tar xJ
          mv blender-4.2.4-linux-x64 ../
          echo "PATH=../blender-4.2.4-linux-x64/:$PATH" >> $GITHUB_ENV
      - name: Install Linux libraries
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 graphviz graphviz-dev \
            mesa-vulkan-drivers xvfb
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install zstandard==0.16.0
          pip install numpy
          pip install flybrains --no-deps
          pip install git+https://github.com/siavashk/pycpd@master
          pip install pyarrow
      - name: Install navis
        # `cloudvolume` is deliberately kept out of `[all]` (see `specialized`
        # in setup.py) but the `patch_cloudvolume` doctest needs it, so ask for
        # it explicitly rather than let that doctest go untested.
        run: pip install -e .[dev,all,cloudvolume]
      - name: Report dependency versions
        run: |
          which blender
          pip freeze -r requirements.txt
      # `xvfb-run` is invoked directly rather than through coactions/setup-xvfb:
      # that action feeds its `run` input to xvfb-run one *line* at a time, with
      # no shell in between, so the `export`s that used to sit here each ran in
      # their own throwaway process and never reached pytest. They are declared
      # as step environment instead - which pytest.ini also sets, so the suite
      # has in fact been running with them all along.
      - name: Test
        env:
          NAVIS_HEADLESS: "TRUE"
          NAVIS_TEST_ENV: "TRUE"
        run: xvfb-run --auto-servernum pytest --verbose
